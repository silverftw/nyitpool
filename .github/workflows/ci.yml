name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker module (ESM import)
        run: node --input-type=module -e "import { pathToFileURL } from 'node:url'; import { join } from 'node:path'; const m = await import(pathToFileURL(join(process.cwd(), 'src', 'index.js')).href); if (typeof m.default?.fetch !== 'function') { throw new Error('worker default.fetch missing'); } console.log('worker OK');"

      - name: Build check (wrangler dry-run)
        run: npx wrangler deploy --dry-run --outdir=dist

      - name: Sanity-check static assets
        run: test -f public/index.html && grep -q "NYIT Pool" public/index.html
